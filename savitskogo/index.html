<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Савицкого 27, кв. 12 · Трекер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fa;--surface:#ffffff;--surface2:#eef1f6;--border:#dde2ea;
  --text:#1e232e;--muted:#525c6b;--accent:#4f46e5;--accent2:#4f46e5;
  --done:#16a34a;--blocked:#b45309;--todo:#98a1af;
  --r:8px;--r2:4px;
}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}

/* ── header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700}
header h1 span{color:var(--accent)}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:3px 9px;font-size:12px;color:var(--muted)}
.stat b{color:var(--text)}
.progress-bar{width:100%;height:3px;background:var(--border);border-radius:2px;margin-top:5px}
.progress-fill{height:3px;background:var(--done);border-radius:2px;transition:width .4s}

/* ── filters ── */
.filters{padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:53px;z-index:99}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:3px 11px;border-radius:20px;cursor:pointer;font-size:12px;transition:all .15s}
.filter-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.search{flex:1;min-width:140px;max-width:280px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:20px;font-size:12px;outline:none}
.search::placeholder{color:var(--muted)}

/* ── layout ── */
main{padding:16px 20px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ── stage ── */
.stage{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.stage.general .stage-header{background:linear-gradient(90deg,#ede9fe 0%,var(--surface) 100%)}
.stage-header{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.stage-header:hover{background:var(--surface2)}
.stage-num{background:var(--accent2);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0}
.stage.general .stage-num{background:#7c3aed}
.stage-name{font-weight:600;font-size:14px;flex:1}
.stage-meta{display:flex;gap:8px;align-items:center}
.stage-pct{font-size:11px;color:var(--muted)}
.mini-bar{width:52px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.mini-fill{height:3px;background:var(--done);border-radius:2px}
.chevron{color:var(--muted);transition:transform .2s;font-size:15px}
.stage.open .chevron{transform:rotate(180deg)}
/* progressive green fill: grows left-to-right with completion */
.stage-header,.section-header{position:relative}
.stage-header>*,.section-header>*{position:relative;z-index:1}
.stage-header>.pfill,.section-header>.pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#86efac;z-index:0;pointer-events:none;transition:width .4s}
.stage-body{display:none;border-top:1px solid var(--border)}
.stage.open .stage-body{display:block}

/* ── section ── */
.section{border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.section-header{padding:9px 16px 9px 28px;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--surface2)}
.section-header:hover{background:var(--bg)}
.section-label{font-size:11px;font-weight:600;color:var(--muted);flex:1;text-transform:uppercase;letter-spacing:.4px}
.section.open-q .section-label{color:var(--blocked)}
.section-count{font-size:11px;color:var(--muted)}
/* section fully completed -> green */
.section.all-done .section-header{background:#ecfdf5}
.section.all-done .section-header:hover{background:#dcfce7}
.section.all-done .section-label{color:#0b5c2e}
.section.all-done .section-count{color:#0b5c2e;font-weight:700}
.section.all-done .section-count::after{content:' \2713'}
.section.all-done .sec-chevron{color:#0b5c2e}
.sec-chevron{color:var(--muted);transition:transform .2s;font-size:12px}
.section.open .sec-chevron{transform:rotate(180deg)}
.section-tasks{display:none}
/* section / stage with nothing left under the active filter */
.sec-hidden{display:none!important}
.stage-hidden{display:none!important}
.section.open .section-tasks{display:block}

/* ── task ── */
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 16px 8px 36px;border-bottom:1px solid var(--border);transition:background .1s}
.task:last-child{border-bottom:none}
.task:hover{background:var(--surface2)}
.task.hidden{display:none!important}
.task-check input[type=checkbox]{width:16px;height:16px;accent-color:var(--done);cursor:pointer;flex-shrink:0;margin-top:2px}
.task-body{flex:1;min-width:0}
.task-text{line-height:1.45;word-break:break-word}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-actions{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.task-badge{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;cursor:pointer;border:none}
.badge-done{background:#dcfce7;color:#15803d}
.badge-blocked{background:#fef3c7;color:#b45309}
.badge-todo{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.task-note{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;border-left:2px solid var(--border);padding-left:8px}
.task-img{display:block;max-width:240px;max-height:180px;margin-top:7px;border:1px solid var(--border);border-radius:var(--r2);cursor:zoom-in;background:#fff}
.task-img:hover{border-color:var(--accent)}
.task-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px;opacity:.35;transition:opacity .15s}
.task:hover .task-del{opacity:1}
.task-del:hover{opacity:1!important;color:#dc2626}

/* ── add-task row ── */
.add-task-row{display:flex;gap:8px;padding:8px 16px 10px 36px;border-top:1px solid var(--border)}
.add-task-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:var(--r2);font-size:13px;outline:none;min-width:0}
.add-task-input:focus{border-color:var(--accent)}
.add-task-input::placeholder{color:var(--muted)}
.add-task-btn{background:var(--accent2);color:#fff;border:none;padding:6px 14px;border-radius:var(--r2);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.add-task-btn:hover{opacity:.85}

/* ── status picker popup ── */
.status-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px #0000001f;z-index:500;min-width:160px;display:none;padding:4px 0}
.status-menu.show{display:block}
.status-menu button{display:block;width:100%;background:none;border:none;color:var(--text);padding:8px 14px;text-align:left;cursor:pointer;font-size:13px}
.status-menu button:hover{background:var(--surface2)}

/* ── save btn ── */
.save-btn{position:fixed;bottom:20px;right:20px;background:var(--accent2);color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 4px 16px #00000024;z-index:200;display:none}
.save-btn:hover{opacity:.85}
.save-status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;display:none}

/* ── баннер проекта (визуализация) ── */
.project-banner{position:relative;max-width:900px;margin:14px auto 0;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--border);background:var(--surface2);height:250px}
.project-banner img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.project-banner .pb-cap{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,rgba(30,35,46,0),rgba(30,35,46,.62))}
@media(max-width:700px){.project-banner{height:180px;margin:10px 12px 0;border-radius:var(--r)}}
</style>
</head>
<body>

<header>
  <div style="flex:1;min-width:200px">
    <h1>Савицкого 27, кв. 12 · <span>Трекер</span></h1>
    <div style="font-size:12px;margin-top:4px"><a href="../" style="color:#6d2b5f;text-decoration:none">← 1326_JUU</a></div>
    <div class="progress-bar"><div class="progress-fill" id="main-bar"></div></div>
  </div>
  <div class="stats">
    <div class="stat">Выполнено <b id="s-pct">0%</b></div>
    <div class="stat">Всего <b id="s-total">0</b></div>
    <div class="stat">✓ <b id="s-done">0</b></div>
    <div class="stat">⏳ <b id="s-blocked">0</b></div>
    <div class="stat">○ <b id="s-todo">0</b></div>
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
  <button class="filter-btn" onclick="setFilter('todo',this)">Не начато</button>
  <button class="filter-btn" onclick="setFilter('blocked',this)">Ожидают</button>
  <button class="filter-btn" onclick="setFilter('done',this)">Готово</button>
  <input class="search" id="search" placeholder="Поиск…" oninput="doSearch(this.value)">
</div>

<main id="main"></main>

<!-- status popup -->
<div class="status-menu" id="status-menu">
  <button onclick="applyStatus('todo')">○ Не начато</button>
  <button onclick="applyStatus('blocked')">⏳ Ожидает согласования</button>
  <button onclick="applyStatus('done')">✓ Готово</button>
</div>

<button class="save-btn" id="save-btn" onclick="saveToGist()">💾 Сохранить</button>
<div class="save-status" id="save-status"></div>

<script>
const GIST_ID = "715f5b022ebab8bad88e405a805791b8";
const GIST_FILE = "savitskogo-27-state.json";
const GH_USER = "art19323";
const STAGES = [{"id": "I", "title": "I · Обмеры ДМ", "sections": [{"id": "s01", "title": "01 · Ведомость чертежей", "tasks": []}, {"id": "s02", "title": "02 · Схема обмеров габаритов объекта", "tasks": []}, {"id": "s03", "title": "03 · Фотофиксация объекта", "tasks": []}, {"id": "s04", "title": "04 · Схема обмеров инженерных элементов объекта", "tasks": []}, {"id": "s05", "title": "05 · Фотофиксация инженерных коммуникаций объекта", "tasks": []}, {"id": "s06", "title": "06 · Схема демонтажа конструкций", "tasks": []}, {"id": "s07", "title": "07 · Схема монтажа конструкций", "tasks": []}, {"id": "s08", "title": "08 · Виды монтируемых элементов", "tasks": []}, {"id": "oq1", "title": "Открытые вопросы · Обмеры ДМ", "tasks": [], "is_open_q": true}]}, {"id": "II", "title": "II · Планировка", "sections": [{"id": "s10", "title": "09 · Схема перепланировки", "tasks": []}, {"id": "s11", "title": "10 · Схема планировочного решения с мебелью", "tasks": []}, {"id": "s12", "title": "11 · Схема мебели с размерами", "tasks": []}, {"id": "s13", "title": "12 · Спецификация мебели", "tasks": []}, {"id": "s15", "title": "14 · Виды стен с мебелью", "tasks": []}, {"id": "oq2", "title": "Открытые вопросы · Планировка", "tasks": [], "is_open_q": true}]}, {"id": "III", "title": "III · Сантехника", "sections": [{"id": "s18b", "title": "18 · Схема привязки сантехнического оборудования", "tasks": []}, {"id": "s19", "title": "19 · Спецификация сантехнического оборудования", "tasks": []}, {"id": "s20", "title": "20 · Виды стен с сантехникой", "tasks": []}, {"id": "s21", "title": "21 · Схема привязки отопительных приборов и теплых полов", "tasks": []}, {"id": "oq3", "title": "Открытые вопросы · Сантехника", "tasks": [], "is_open_q": true}]}, {"id": "IV", "title": "IV · Электрика", "sections": [{"id": "s25", "title": "25 · Схема элементов освещения объекта", "tasks": []}, {"id": "s26", "title": "26 · Схема привязки потолочных светильников", "tasks": []}, {"id": "s27", "title": "27 · Схема привязки настенных светильников и подсветок", "tasks": []}, {"id": "s28", "title": "28 · Схема групп освещения", "tasks": []}, {"id": "s29", "title": "29 · Спецификация светильников", "tasks": []}, {"id": "s30", "title": "30 · Схема привязки розеток и электровыводов", "tasks": []}, {"id": "s31", "title": "31 · Сводная схема привязки розеток, выключателей и электровыводов", "tasks": []}, {"id": "s33", "title": "33 · Виды стен с элементами электрики", "tasks": []}, {"id": "oq4", "title": "Открытые вопросы · Электрика", "tasks": [], "is_open_q": true}]}, {"id": "V", "title": "V · Отделка", "sections": [{"id": "s22", "title": "22 · Схема обозначения напольных покрытий", "tasks": []}, {"id": "s23", "title": "23 · Схема заполнения дверных проемов", "tasks": []}, {"id": "s24", "title": "24 · План потолков", "tasks": []}, {"id": "s34", "title": "34 · Схема отделки стен", "tasks": []}, {"id": "s35", "title": "35 · Виды стен с отделкой", "tasks": []}, {"id": "oq5", "title": "Открытые вопросы · Отделка", "tasks": [], "is_open_q": true}]}, {"id": "VI", "title": "VI · 3D визуализации", "sections": [{"id": "s39", "title": "3D визуализации", "tasks": []}, {"id": "oq6", "title": "Открытые вопросы · 3D визуализации", "tasks": [], "is_open_q": true}]}, {"id": "general", "title": "Общие вопросы проекта", "sections": [{"id": "general", "title": "Общие вопросы", "tasks": []}], "is_general": true}];

let state = {};       // taskId -> {status, text?, custom?}
let customTasks = {}; // sectionId -> [{id,text,status}]
let dirty = false;
let currentFilter = 'all';
let currentSearch = '';
let statusMenuTarget = null;

// ── persistence ───────────────────────────────────────────────────────────────
async function loadState() {
  try {
    const url = `https://gist.githubusercontent.com/${GH_USER}/${GIST_ID}/raw/${GIST_FILE}?t=${Date.now()}`;
    const r = await fetch(url);
    if (r.ok) {
      const d = await r.json();
      state = d.tasks || {};
      customTasks = d.custom || {};
    }
  } catch(e) { console.log('load error', e); }
  render();
}

async function saveToGist() {
  const btn = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');
  btn.textContent = '⏳ Сохраняю…'; btn.disabled = true;
  try {
    const token = getToken();
    if (!token) { showStatus('Токен не найден — введи его при запросе'); return; }
    const payload = { files: { [GIST_FILE]: { content: JSON.stringify(
      { project:'Савицкого 27, кв. 12', tasks: state, custom: customTasks }, null, 2) } } };
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json',
                 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify(payload)
    });
    if (r.ok) { dirty = false; btn.style.display = 'none'; showStatus('✓ Сохранено'); }
    else showStatus('Ошибка: ' + r.status);
  } catch(e) { showStatus('Ошибка: ' + e.message); }
  btn.textContent = '💾 Сохранить'; btn.disabled = false;
}

function getToken() {
  let t = localStorage.getItem('gh_token');
  if (t) return t;
  t = prompt('GitHub токен (gist + repo scope):');
  if (t) localStorage.setItem('gh_token', t.trim());
  return t;
}

function showStatus(msg) {
  const el = document.getElementById('save-status');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

function markDirty() {
  dirty = true;
  document.getElementById('save-btn').style.display = 'block';
}

// ── status ────────────────────────────────────────────────────────────────────
function openStatusMenu(tid, badgeEl) {
  statusMenuTarget = tid;
  const menu = document.getElementById('status-menu');
  const rect = badgeEl.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4 + window.scrollY) + 'px';
  menu.style.left = rect.left + 'px';
  menu.classList.add('show');
  setTimeout(() => document.addEventListener('click', closeMenuOnce), 0);
}
function closeMenuOnce(e) {
  if (!document.getElementById('status-menu').contains(e.target)) {
    document.getElementById('status-menu').classList.remove('show');
    document.removeEventListener('click', closeMenuOnce);
  }
}
function applyStatus(s) {
  document.getElementById('status-menu').classList.remove('show');
  if (!statusMenuTarget) return;
  setTaskStatus(statusMenuTarget, s);
}
function setTaskStatus(tid, s) {
  if (!state[tid]) state[tid] = {};
  if (typeof state[tid] === 'string') state[tid] = {status: state[tid]};
  state[tid].status = s;
  markDirty();
  refreshTask(tid);
  updateStats();
  updateSectionCounts();
}
function getStatus(tid) {
  const v = state[tid];
  if (!v) return 'todo';
  if (typeof v === 'string') return v;
  return v.status || 'todo';
}

// ── add custom task ───────────────────────────────────────────────────────────
function addTask(secId) {
  const input = document.getElementById('input_' + secId);
  const text = input.value.trim();
  if (!text) return;
  const id = 'custom_' + secId + '_' + Date.now();
  if (!customTasks[secId]) customTasks[secId] = [];
  customTasks[secId].push({id, text});
  state[id] = {status: 'todo'};
  input.value = '';
  markDirty();
  // append task element
  const tasksEl = document.getElementById('tasks_' + secId);
  const addRow = document.getElementById('add_' + secId);
  tasksEl.insertBefore(makeTaskEl(id, text, 'todo', true), addRow);
  updateStats();
  updateSectionCounts();
  reapplyFilters();
}

function deleteTask(tid, secId) {
  if (!confirm('Удалить пункт?')) return;
  const isCustomTask = !!(customTasks[secId] || []).find(t => t.id === tid);
  if (isCustomTask) {
    customTasks[secId] = customTasks[secId].filter(t => t.id !== tid);
    delete state[tid];
  } else {
    // built-in task: hide it and remember the choice in the saved state
    if (typeof state[tid] === 'string') state[tid] = {status: state[tid]};
    if (!state[tid]) state[tid] = {};
    state[tid].deleted = true;
  }
  const el = document.getElementById('t_' + tid);
  if (el) el.remove();
  markDirty();
  updateStats();
  updateSectionCounts();
}

// ── render ────────────────────────────────────────────────────────────────────
function badgeHtml(tid, s) {
  const cls = s === 'done' ? 'badge-done' : s === 'blocked' ? 'badge-blocked' : 'badge-todo';
  const lbl = s === 'done' ? '✓ Готово' : s === 'blocked' ? '⏳ Ожидает' : '○ Не начато';
  return `<button class="task-badge ${cls}" onclick="openStatusMenu('${tid}',this)">${lbl}</button>`;
}

function makeTaskEl(tid, text, initStatus, isCustom, note, secId, img) {
  const el = document.createElement('div');
  el.className = 'task' + (initStatus === 'done' ? ' done' : '');
  el.id = 't_' + tid;
  el.dataset.sec = secId || '';
  el.innerHTML = `
    <input type="checkbox" style="width:16px;height:16px;accent-color:var(--done);cursor:pointer;flex-shrink:0;margin-top:3px"
      ${initStatus==='done'?'checked':''} onchange="toggleDone('${tid}',this.checked)">
    <div class="task-body">
      <div class="task-text">${escHtml(text)}</div>
      ${img ? `<a href="${escHtml(img)}" target="_blank" rel="noopener"><img class="task-img" src="${escHtml(img)}" loading="lazy" alt="скриншот"></a>` : ''}
      <div class="task-actions">
        ${badgeHtml(tid, initStatus)}
        <button class="task-del" onclick="deleteTask('${tid}','${secId}')" title="Удалить">✕</button>
      </div>
      ${note ? `<div class="task-note">${escHtml(note)}</div>` : ''}
    </div>`;
  return el;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function refreshTask(tid) {
  const el = document.getElementById('t_' + tid);
  if (!el) return;
  const s = getStatus(tid);
  el.className = 'task' + (s === 'done' ? ' done' : '') + (el.classList.contains('hidden') ? ' hidden' : '');
  const badge = el.querySelector('.task-badge');
  if (badge) {
    badge.className = 'task-badge ' + (s==='done'?'badge-done':s==='blocked'?'badge-blocked':'badge-todo');
    badge.textContent = s==='done'?'✓ Готово':s==='blocked'?'⏳ Ожидает':'○ Не начато';
  }
  const cb = el.querySelector('input[type=checkbox]');
  if (cb) cb.checked = s === 'done';
  applyFilterToEl(el, tid);
}

function toggleDone(tid, checked) {
  setTaskStatus(tid, checked ? 'done' : 'todo');
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  STAGES.forEach((stage, si) => {
    const isGeneral = !!stage.is_general;
    const stEl = document.createElement('div');
    stEl.className = 'stage' + (isGeneral?' general':'') + (si===0?' open':'');

    const header = document.createElement('div');
    header.className = 'stage-header';
    const label = isGeneral ? 'Общие вопросы проекта' : stage.title.replace(/^Этап \d+ · /,'');
    header.innerHTML = `
      <span class="pfill"></span>
      <span class="stage-num">${isGeneral?'★':'Этап '+stage.id}</span>
      <span class="stage-name">${escHtml(label)}</span>
      <span class="stage-meta">
        <span class="stage-pct"></span>
        <span class="mini-bar"><span class="mini-fill" style="width:0%"></span></span>
      </span>
      <span class="chevron">▾</span>`;
    header.onclick = () => stEl.classList.toggle('open');

    const body = document.createElement('div');
    body.className = 'stage-body';

    stage.sections.forEach(sec => {
      const isOQ = !!sec.is_open_q;
      const secEl = document.createElement('div');
      secEl.className = 'section' + (isOQ?' open-q':'');

      const sh = document.createElement('div');
      sh.className = 'section-header';
      sh.innerHTML = `<span class="pfill"></span><span class="section-label">${escHtml(sec.title)}</span>
        <span class="section-count" id="cnt_${sec.id}"></span>
        <span class="sec-chevron">▾</span>`;
      sh.onclick = () => secEl.classList.toggle('open');

      const tasksEl = document.createElement('div');
      tasksEl.className = 'section-tasks';
      tasksEl.id = 'tasks_' + sec.id;

      // static tasks
      sec.tasks.forEach(t => {
        const tid = t.id;
        if (state[tid] && state[tid].deleted) return;
        if (!state[tid]) state[tid] = {status: t.status || 'todo'};
        const s = getStatus(tid);
        const el = makeTaskEl(tid, t.text, s, false, t.note, sec.id);
        tasksEl.appendChild(el);
      });

      // custom tasks for this section
      (customTasks[sec.id] || []).forEach(ct => {
        if (!state[ct.id]) state[ct.id] = {status: 'todo'};
        const s = getStatus(ct.id);
        const el = makeTaskEl(ct.id, ct.text, s, true, ct.note || '', sec.id, ct.img);
        el.id = 't_' + ct.id;
        tasksEl.appendChild(el);
      });

      // add-task row
      const addRow = document.createElement('div');
      addRow.className = 'add-task-row';
      addRow.id = 'add_' + sec.id;
      addRow.innerHTML = `
        <input class="add-task-input" id="input_${sec.id}" placeholder="+ Добавить задачу…"
          onkeydown="if(event.key==='Enter')addTask('${sec.id}')">
        <button class="add-task-btn" onclick="addTask('${sec.id}')">Добавить</button>`;
      tasksEl.appendChild(addRow);

      secEl.appendChild(sh);
      secEl.appendChild(tasksEl);
      body.appendChild(secEl);
    });

    stEl.appendChild(header);
    stEl.appendChild(body);
    main.appendChild(stEl);
  });
  updateStats();
  updateSectionCounts();
}

// ── filters ───────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  reapplyFilters();
}
function doSearch(q) {
  currentSearch = q.toLowerCase().trim();
  reapplyFilters();
}
function reapplyFilters() {
  document.querySelectorAll('.task').forEach(el => {
    const tid = el.id.replace('t_','');
    applyFilterToEl(el, tid);
  });
  applySectionVisibility();
}

// Hide a section when nothing in it matches the active filter (e.g. a fully
// completed or still empty section while the 'Не начато' filter is on).
// Empty sections stay visible only in the unfiltered view, where they are needed
// as a place to add new items.
function applySectionVisibility() {
  document.querySelectorAll('.stage').forEach(stEl => {
    let visible = 0;
    stEl.querySelectorAll('.section').forEach(sec => {
      const all = [...sec.querySelectorAll('.task')];
      const shown = all.filter(t => !t.classList.contains('hidden')).length;
      const filtered = currentFilter !== 'all' || !!currentSearch;
      const hide = shown === 0 && (all.length > 0 || filtered);
      sec.classList.toggle('sec-hidden', hide);
      if (!hide) visible++;
    });
    stEl.classList.toggle('stage-hidden', visible === 0);
  });
}
function applyFilterToEl(el, tid) {
  const s = getStatus(tid);
  const text = (el.querySelector('.task-text')||{}).textContent || '';
  const matchF = currentFilter==='all' || currentFilter===s;
  const matchS = !currentSearch || text.toLowerCase().includes(currentSearch);
  el.classList.toggle('hidden', !matchF || !matchS);
}

// ── stats ─────────────────────────────────────────────────────────────────────
// The fill gets more saturated the more of the folder is done:
// 0% = barely-tinted green, 100% = solid green. Lightness is capped so the
// dark label text stays readable on top.
function fillColor(pct) {
  const t = Math.max(0, Math.min(100, pct)) / 100;
  const sat = 45 + 35 * t;
  const lig = 93 - 22 * t;
  return `hsl(142 ${sat.toFixed(0)}% ${lig.toFixed(0)}%)`;
}
function updateStats() {
  let total=0, done=0, blocked=0, todo=0;
  document.querySelectorAll('.task').forEach(el => {
    const tid = el.id.replace('t_','');
    if (tid === '' || el.classList.contains('add-task-row')) return;
    const s = getStatus(tid);
    total++; if(s==='done')done++; else if(s==='blocked')blocked++; else todo++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-blocked').textContent = blocked;
  document.getElementById('s-todo').textContent = todo;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('main-bar').style.width = pct + '%';
  document.getElementById('s-pct').textContent = pct + '%';
  document.querySelectorAll('.stage').forEach(stEl => {
    const tasks = [...stEl.querySelectorAll('.task')].filter(t => !t.id.endsWith('_'));
    const d = tasks.filter(t => getStatus(t.id.replace('t_','')) === 'done').length;
    const fill = stEl.querySelector('.mini-fill');
    const pctEl = stEl.querySelector('.stage-pct');
    const pctStage = tasks.length ? Math.round(d/tasks.length*100) : 0;
    if (fill) fill.style.width = pctStage + '%';
    if (pctEl) pctEl.textContent = tasks.length ? `${d}/${tasks.length} · ${pctStage}%` : '';
    const hdrFill = stEl.querySelector('.stage-header .pfill');
    if (hdrFill) {
      hdrFill.style.width = pctStage + '%';
      hdrFill.style.background = fillColor(pctStage);
    }
  });
}
function updateSectionCounts() {
  document.querySelectorAll('.section').forEach(sec => {
    const tasks = [...sec.querySelectorAll('.task')];
    const done = tasks.filter(t => getStatus(t.id.replace('t_','')) === 'done').length;
    const pctSec = tasks.length ? Math.round(done/tasks.length*100) : 0;
    const cntEl = sec.querySelector('.section-count');
    if (cntEl) cntEl.textContent = tasks.length ? `${done}/${tasks.length} · ${pctSec}%` : '0';
    const secFill = sec.querySelector('.section-header .pfill');
    if (secFill) {
      secFill.style.width = pctSec + '%';
      secFill.style.background = fillColor(pctSec);
    }
    sec.classList.toggle('all-done', tasks.length > 0 && done === tasks.length);
  });
  applySectionVisibility();
}

loadState();
</script>
